name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Both repos are checked out as siblings under the workspace root,
      # so the ../lyra-ui alias in vite.config.ts resolves as it does locally.
      - name: Checkout Email Interaction
        uses: actions/checkout@v4
        with:
          path: Email Interaction

      - name: Checkout lyra-ui
        uses: actions/checkout@v4
        with:
          repository: lorinabinningnice/lyra-ui
          path: lyra-ui

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lyra-ui dependencies
        working-directory: lyra-ui
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install app dependencies
        working-directory: Email Interaction
        run: npm ci

      - name: Build
        working-directory: Email Interaction
        env:
          VITE_BASE: /emailinteraction/
        run: npx vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Email Interaction/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
